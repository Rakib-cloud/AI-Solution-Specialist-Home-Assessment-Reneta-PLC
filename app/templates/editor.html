{% extends "base.html" %}
{% block title %}Edit policy · Leave Policy Assistant{% endblock %}
{% block crumb %}Policy editor{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/editor.js') }}"></script>
{% endblock %}
{% block body %}
<main class="page editor" id="editor-app" data-id="{{ policy_id }}">
  <div class="editor-bar">
    <a class="icon-button" href="{{ url_for('main.policies') }}" data-tip="Back to policies" aria-label="Back to policies">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5L9 12l5.5 5.5"/></svg>
    </a>
    <div class="editor-id">
      <h1 id="editor-title">Loading…</h1>
      <p class="editor-sub">
        <span class="status-pill is-draft" id="editor-status">draft</span>
        <span class="dirty-flag" id="editor-dirty" hidden>Unsaved changes</span>
      </p>
    </div>
    <div class="editor-actions" id="editor-actions"></div>
  </div>

  <p id="editor-error" class="form-error" hidden></p>

  <div class="editor-shell">
    <nav class="outline" id="outline" role="tablist" aria-orientation="vertical" aria-label="Policy outline"></nav>
    <section class="editor-pane" id="editor-pane" role="tabpanel" tabindex="-1">
      <p class="meta">Loading the policy…</p>
    </section>
  </div>
</main>
{% endblock %}
