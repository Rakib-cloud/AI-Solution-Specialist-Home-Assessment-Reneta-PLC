<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Leave Policy Assistant{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23054f9f'/%3E%3Cpath d='M9 8.5h9.2L23 13.2V23.5a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 8 23.5v-13A1.5 1.5 0 0 1 9.5 9' fill='none' stroke='%23ffffff' stroke-width='1.6'/%3E%3Cpath d='M17.5 8.8V13H22' fill='none' stroke='%23ffffff' stroke-width='1.6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Sections">
      <div class="side-top">
        <a class="side-brand" href="{{ url_for('main.policies') }}">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="30" height="30">
              <rect width="32" height="32" rx="9" fill="#ffffff"/>
              <path d="M9 8.5h9.2L23 13.2V23.5a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 8 23.5v-13A1.5 1.5 0 0 1 9.5 9" fill="none" stroke="#054f9f" stroke-width="1.6"/>
              <path d="M17.5 8.8V13H22" fill="none" stroke="#054f9f" stroke-width="1.6"/>
            </svg>
          </span>
          <span>
            <span class="side-kicker">HR policy desk</span>
            <span class="side-title">Leave Policy Assistant</span>
          </span>
        </a>
      </div>

      <nav class="side-group" aria-label="Main">
        <p class="side-group-label">Workspace</p>
        <a class="nav-item {% if active == 'policies' %}is-active{% endif %}" href="{{ url_for('main.policies') }}" {% if active == 'policies' %}aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7h11M9 12h11M9 17h11"/><circle cx="4.5" cy="7" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17" r="1"/></svg>
          Policies
        </a>
        <a class="nav-item {% if active == 'assistant' %}is-active{% endif %}" href="{{ url_for('main.index') }}" {% if active == 'assistant' %}aria-current="page"{% endif %}>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6h11A1.5 1.5 0 0 1 19 7.5v6A1.5 1.5 0 0 1 17.5 15H9l-3.2 2.6V7.5A1.5 1.5 0 0 1 7.3 6z"/><path d="M9.5 10.5h5"/></svg>
          Assistant
        </a>
      </nav>
    </aside>

    <div class="scrim" id="scrim"></div>

    <div class="workspace">
      <header class="topbar">
        <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <nav class="crumbs" aria-label="Breadcrumb">
          <span>Leave policy</span>
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9.5 6.5L15 12l-5.5 5.5"/></svg>
          <span><b>{% block crumb %}Workspace{% endblock %}</b></span>
        </nav>
      </header>

      {% block body %}{% endblock %}
    </div>
  </div>

  <div class="modal-root" id="modal-root" hidden></div>
  <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>

  <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
  <script src="{{ url_for('static', filename='js/shell.js') }}"></script>
  {% block scripts %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% endblock %}
</body>
</html>
